app = "hermes-agent-cloud"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8642
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[env]
  API_SERVER_HOST = "0.0.0.0"
  HERMES_HOME = "/root/.hermes"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
